<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1, width=device-width" />
  <title>Revamping Loan Servicing</title>

  <!-- Inter font to match Figma -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" />

  <style>
    body {
      margin: 0;
      line-height: normal;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #111f36;
      color: #fff;
    }

    /* =========================
       HERO SECTION (TOP)
    ========================== */
    .landing-page {
      width: 100%;
      min-height: 100vh;
      position: relative;
      background: linear-gradient(152.59deg, #020619, #1f3250);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 19px 16px;
      box-sizing: border-box;
      text-align: left;
      font-size: 10px;
      color: #fff;
    }

    .hero-frame-parent {
      width: 800px;
      max-width: 100%;
      height: 683px;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 100px 0 0;
      box-sizing: border-box;
      gap: 20px;
    }

    .hero-frame-group {
      align-self: stretch;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 60px;
    }

    .hero-frame-container {
      align-self: stretch;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 58px;
    }

    .uxui-design-parent {
      border-radius: 4px;
      background-color: rgba(194, 199, 206, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 9px 16px 8px;
      gap: 4px;
    }

    .uxui-design {
      position: relative;
      letter-spacing: 0.4px;
      line-height: 16px;
      font-weight: 600;
    }

    /* 3x3 white dots between tags */
    .tag-dot {
      height: 3px;
      width: 3px;
      border-radius: 50%;
      background-color: #ffffff;
      display: inline-block;
    }

    .revamping-loan-servicing-parent {
      align-self: stretch;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      font-size: 57px;
      color: #90a1b9;
    }

    .revamping-loan-servicing {
      position: relative;
      font-weight: 300;
      background: linear-gradient(90deg, #f9f9f9, #6d7a8e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-fill-color: transparent;
      text-align: center; /* center when it wraps on mobile */
    }

    .designing-a-scalable-container {
      align-self: stretch;
      position: relative;
      font-size: 25px;
      letter-spacing: 0.15px;
      line-height: 42px;
      text-align: center;
    }

    .span {
      font-weight: 600;
      color: #00d492;
    }

    .landing-page-span {
      font-weight: 600;
      color: #51a2ff;
    }

    .hero-meta-row {
      display: flex;
      align-items: flex-start;
      gap: 27px;
      font-size: 12px;
      color: #90a1b9;
    }

    .hero-ellipse-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .frame-inner {
      height: 9px;
      width: 9px;
      position: relative;
      border-radius: 50%;
      background-color: #51a2ff;
    }

    .weeks {
      position: relative;
      letter-spacing: 0.15px;
      line-height: 24px;
    }

    .ellipse-div {
      height: 9px;
      width: 9px;
      position: relative;
      border-radius: 50%;
      background-color: #00d492;
    }

    .landing-page-frame-child {
      height: 9px;
      width: 9px;
      position: relative;
      border-radius: 50%;
      background-color: #fe9a00;
    }

    .rectangle-parent {
      width: 24px;
      height: 40px;
      position: relative;
      opacity: 0.7;
    }

    .group-child {
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 50px;
      border: 1px solid #90a1b9;
      box-sizing: border-box;
      width: 24px;
      height: 40px;
    }

    /* Animated line inside the pill */
    .group-line {
      position: absolute;
      left: 50%;
      width: 4px;
      height: 8px;
      border-radius: 999px;
      background-color: #90a1b9;
      transform: translateX(-50%);
      animation: scrollLine 2.4s ease-in-out infinite;
    }

    @keyframes scrollLine {
      0% {
        top: 26px;  /* near bottom */
      }
      50% {
        top: 10px;  /* near top */
      }
      100% {
        top: 26px;  /* back to bottom */
      }
    }

    @media (max-width: 840px) {
      .hero-frame-parent {
        padding-top: 60px;
        height: auto;
      }
    }

    /* =========================
       OVERVIEW / PROBLEM SECTION
       (SITS BELOW HERO)
    ========================== */

      width: 100%;
      position: relative;
      background-color: #111f36;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 16px 50px;
      box-sizing: border-box;
      text-align: left;
      font-size: 24px;
      color: #f9f9f9;
    }

    .body1 .frame-parent {
      width: 800px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 80px;
    }

    .group-wrapper {
      align-self: stretch;
      height: 497px;
      position: relative;
      border-radius: 12px;
      background: linear-gradient(
        242.19deg,
        rgba(221, 249, 211, 0.6),
        rgba(184, 228, 208, 0.6) 65.38%,
        rgba(88, 201, 185, 0.6) 88.98%
      );
      border: 1px solid rgba(144, 161, 185, 0.2);
      box-sizing: border-box;
      overflow: hidden;
      flex-shrink: 0;
    }
